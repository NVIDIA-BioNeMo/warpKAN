[tool.poetry]
name = "warpKAN"
version = "0.1.0"
description = "GPU-accelerated Bounded and Unbounded KAN"
readme = "README.md"
license = "Apache-2.0"
authors = ["NVIDIA Corporation <info@nvidia.com>"]
homepage = "https://github.com/NVIDIA-Digital-Bio/warpKAN"

[tool.poetry.dependencies]
python = ">=3.7"
numpy = "*"
warp-lang = "*"
torch = "*"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
